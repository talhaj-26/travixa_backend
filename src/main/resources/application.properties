spring.application.name=travixa

spring.profiles.default=local
app.api.title=TRAVIXA
app.api.version=1.0.0
app.api.description=Smart tourism and hospitality platform
app.api.async-request-timeout-millis=30000
app.mail.enabled=${MAIL_ENABLED:false}
app.rest-client.connect-timeout=${REST_CLIENT_CONNECT_TIMEOUT:3s}
app.rest-client.read-timeout=${REST_CLIENT_READ_TIMEOUT:10s}

# Load optional, ignored local development settings from the project-root .env file.
spring.config.import=optional:file:.env[.properties]

# ---------------------------
# JWT
# ---------------------------
app.jwt.expiration=${JWT_EXPIRATION:900000000000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}
app.jwt.secret=${JWT_SECRET:dHJhdml4YS1sb2NhbC1kZXZlbG9wbWVudC1qd3Qtc2VjcmV0LWtleS0yMDI2IQ==}

# ---------------------------
# CORS
# ---------------------------
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ---------------------------
# DATABASE
# ---------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/travixa_backend}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:root123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------
# JPA / HIBERNATE
# ---------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------
# SERVER
# ---------------------------
server.port=8081